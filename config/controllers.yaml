controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
arm_controller:
  ros__parameters:
    joints:
    - L0_L1_Joint
    - L1_L2_Joint
    - L2_L3_Joint
    - L3_L4_Joint
    - L4_L5_Joint
    - L5_L6_Joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
gripper_controller:
  ros__parameters:
    joints:
    - L6_L7_Joint
    - L6_L7.2
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
